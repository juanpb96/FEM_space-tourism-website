name: Merge check for pull requests

on:
  pull_request:
    types: ["opened", "reopened", "edited", "synchronize", "ready_for_review", "closed"]

jobs:
  merge-check:
    if: ${{ github.event.action != 'closed' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Review Code Quality
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: The job has failed
        if: ${{ failure() }}
        run: echo "::error::Pull Request cannot be merged due to failed checks." && exit 1

  storybook-check:
    if: ${{ github.event.action != 'closed' }}
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Build Storybook
        run: npm run build-storybook --quiet

      - name: Serve Storybook and run tests
        run: |
          npx concurrently -k -s first -n "SB,TEST" -c "magenta,blue" \
            "npx http-server storybook-static --port 6006 --silent" \
            "npx wait-on tcp:127.0.0.1:6006 && npm run test-storybook"

      - name: The job has failed
        if: ${{ failure() }}
        run: echo "::error::Pull Request cannot be merged due to failed storybook check." && exit 1

  delete-merged-branch:
    # Only for merged PRs whose branch lives in this repository (not forks)
    if: ${{ github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete merged branch
        uses: actions/github-script@v8
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        with:
          script: |
            const branch = process.env.BRANCH;
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
              core.info(`Deleted branch "${branch}"`);
            } catch (error) {
              // 422: branch was already deleted (e.g. via the "Delete branch" button)
              if (error.status === 422) {
                core.info(`Branch "${branch}" no longer exists, nothing to delete`);
              } else {
                throw error;
              }
            }
